name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_URL: jdbc:postgresql://localhost:5432/omni
  DB_USERNAME: omni
  DB_PASSWORD: omni
  # Clave solo para CI (32 bytes en base64). Producción usa su propio secreto.
  SECRETS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

jobs:
  backend:
    name: Backend (tests y migraciones)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: omni, POSTGRES_USER: omni, POSTGRES_PASSWORD: omni}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with: {name: backend-jar, path: backend/target/*.jar, retention-days: 3}

  frontend:
    name: Frontend (lint, tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Pruebas de humo (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: omni, POSTGRES_USER: omni, POSTGRES_PASSWORD: omni}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/download-artifact@v4
        with: {name: backend-jar, path: backend-jar}
      - name: Levantar backend (aplica migraciones)
        env:
          # Credenciales solo para CI (contraseña e2e-superadmin-2026); el secreto TOTP es público a propósito.
          SUPERADMIN_EMAIL: admin@e2e.test
          SUPERADMIN_PASSWORD_HASH: "$2a$10$5Dopu6VqOemoyqJvWOvMIOVYlfWZCX/z3XCJ1oOV1O6IBG/4ZxeGq"
          SUPERADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        run: |
          nohup java -jar backend-jar/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/api/owner/csrf > /dev/null && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Cargar datos de prueba
        run: PGPASSWORD=omni psql -h localhost -U omni omni -f frontend/e2e/seed.sql
      - name: Construir y levantar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm start > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:3000 > /dev/null && exit 0; sleep 2; done
          cat ../frontend.log; exit 1
      - name: Playwright
        working-directory: frontend
        env: {E2E_SEEDED: "1"}
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      - if: failure()
        run: tail -n 200 backend.log frontend.log
