# Las pruebas levantan varios contextos de Spring (uno por combinación de mocks) y cada uno guarda su pool.
# Un pool chico evita agotar las conexiones de PostgreSQL (max_connections = 100 por defecto).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
marketing.worker-initial-delay-ms=3600000
fiscal.reconcile-initial-delay-ms=3600000
