server:
  error:
    # Los mensajes de ResponseStatusException son textos para el usuario (nunca incluyen secretos).
    include-message: always

spring:
  config:
    # Variables locales en un .env (formato CLAVE=valor). Las variables del sistema tienen prioridad. Ver .env.example.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  web:
    error:
      # Spring Boot 4 lee los mensajes de error desde aquí (server.error.* ya no aplica a la respuesta JSON).
      include-message: always
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  servlet:
    multipart:
      # Fotos de producto (2 MB), logos (512 KB) y archivos de WhatsApp (16 MB); cada servicio valida tamaño y formato real.
      max-file-size: 16MB
      max-request-size: 17MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Las migraciones aplicadas son inmutables: si alguien edita un V__ ya ejecutado, el arranque falla.
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    # Solo para adoptar una base existente sin historial de Flyway. En una base nueva no tiene efecto.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:sin-configurar}
        chat:
          # Modelo principal; al arrancar se verifica que exista para la clave.
          model: ${GEMINI_MODEL:gemini-3.5-flash}

# Integraciones. Todos los secretos llegan por variables de entorno (ver docs/configuracion.md).
whatsapp:
  cloud:
    graph-url: https://graph.facebook.com
    graph-version: ${WHATSAPP_GRAPH_VERSION:v23.0}

culqi:
  api-url: https://api.culqi.com
  subscriptions:
    create-path: /v2/recurrent/subscriptions/create
    get-path: /v2/recurrent/subscriptions/{id}
    cancel-path: /v2/recurrent/subscriptions/{id}

mercadopago:
  api-url: https://api.mercadopago.com
  auth-url: https://auth.mercadopago.com/authorization

subscription:
  trial-days: 14
  grace-days: 5

# Correos transaccionales (registro, recuperación de acceso, invitaciones).
# Sin RESEND_API_KEY los correos se registran en email_log y en el log de la aplicación (modo desarrollo).
email:
  resend-api-key: ${RESEND_API_KEY:}
  # Sin dominio verificado en Resend usa onboarding@resend.dev (solo entrega al correo dueño de la cuenta Resend).
  from: ${EMAIL_FROM:Omnicanal <onboarding@resend.dev>}
  reply-to: ${EMAIL_REPLY_TO:}
  api-url: https://api.resend.com

assistant:
  # Si el modelo principal está saturado (503/429) se reintenta y el último intento usa este alias, que apunta al Flash vigente.
  gemini-fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-flash-latest}
  gemini-retry-delay-ms: 1500
  # Ventana de agrupación: mensajes seguidos del mismo chat dentro de este tiempo reciben una sola respuesta.
  debounce-ms: ${AI_DEBOUNCE_MS:8000}

# Análisis de archivos entrantes de WhatsApp: tres clientes independientes, cada uno con su clave, modelo y timeout.
# Apagados por defecto; los resultados se guardan en whatsapp_media y nunca se vuelven a pedir.
media:
  moderation:
    # Cliente 1: Sightengine (contenido explícito). Una imagen con puntaje >= threshold queda BLOCKED_NSFW.
    enabled: ${SIGHTENGINE_ENABLED:false}
    api-user: ${SIGHTENGINE_API_USER:}
    api-secret: ${SIGHTENGINE_API_SECRET:}
    threshold: ${SIGHTENGINE_NSFW_THRESHOLD:0.7}
    timeout-ms: ${SIGHTENGINE_TIMEOUT_MS:10000}
  transcription:
    # Cliente 2: Groq Whisper (notas de voz).
    enabled: ${GROQ_TRANSCRIPTION_ENABLED:false}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
    language: ${GROQ_WHISPER_LANGUAGE:es}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
  vision:
    # Cliente 3: modelo de visión propio (Gemini Flash-Lite), separado de la IA conversacional.
    enabled: ${VISION_ENABLED:false}
    api-key: ${VISION_GEMINI_API_KEY:${GOOGLE_GENAI_API_KEY:}}
    model: ${VISION_MODEL:gemini-flash-lite-latest}
    timeout-ms: ${VISION_TIMEOUT_MS:20000}
    # Sin moderación confirmada (SAFE) no se analiza la foto.
    require-moderation: ${VISION_REQUIRE_MODERATION:true}

app:
  # URL pública del frontend, usada en los enlaces de los correos.
  base-url: ${APP_BASE_URL:${STOREFRONT_BASE_URL:http://localhost:3000}}

# Cuentas de compradores en la tienda pública. Sin GOOGLE_CLIENT_ID el botón de Google no aparece.
customers:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  session-days: 30
